apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flo-home-cloudflare
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:FlorianGubler-Home/k8s-infra
    targetRevision: HEAD
    path: cicd/cloudflare/
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flo-home-prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:FlorianGubler-Home/k8s-infra
    targetRevision: HEAD
    path: cicd/prometheus/
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
