name: Deploy to Kubernetes
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - prod
      chart:
        description: 'Deploy Component'
        required: true
        default: "*"
        type: choice
        options:
          - "*"
          - cert-manager
          - ci-access
          - cloudflare
          - grafana
          - metallb
          - persistent-volumes
          - production
          - prometheus
          - sealed-secrets
          - traefik
jobs:
  call-deploy:
    runs-on: 
      group: ${{ format('{0}', github.event.inputs.environment) }}
      
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup Helm
      uses: azure/setup-helm@v4

    - name: Verify Kubernetes tools
      run: |
        kubectl version --client
        helm version --short

    - name: Build Helm chart dependencies
      run: |
        for chart in ./infra/*/Chart.yaml; do
          chart_dir="${chart%/Chart.yaml}"
          if grep -q '^dependencies:' "$chart"; then
            helm dependency build "$chart_dir"
          fi
        done
    
    - name: Extract branch
      shell: bash
      run: echo "revision=$( echo ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}} | sed 's/\//-/g')" >> $GITHUB_OUTPUT
      id: branch
        
    - name: Deploy the Helm chart(s)
      run: | 
        CHART_NAME=${{ github.event.inputs.chart }}
        ENVIRONMENT=${{ github.event.inputs.environment }}
        
        deploy_chart() {
          local path="$1"
          echo "Deploying $path to $ENVIRONMENT"

          local helm_args=()
          if [ -f "$path/values.yaml" ]; then
            helm_args+=(--values "$path/values.yaml")
          elif [ -f "$path/values/$ENVIRONMENT.yaml" ]; then
            helm_args+=(--values "$path/values/$ENVIRONMENT.yaml")
          fi

          helm upgrade --install \
            --set revision=${{ steps.branch.outputs.revision }} \
            --wait \
            "$(basename "$path")" \
            "$path" \
            "${helm_args[@]}"
        }

        if [[ "$CHART_NAME" == "*" ]]; then
          # Deploy shared infrastructure in dependency order. Remaining charts are
          # appended alphabetically so newly added components are not omitted.
          CHART_PATHS=(
            "./infra/metallb"
            "./infra/persistent-volumes"
            "./infra/sealed-secrets"
            "./infra/cert-manager"
            "./infra/traefik"
            "./infra/prometheus"
            "./infra/grafana"
            "./infra/ci-access"
            "./infra/cloudflare"
            "./infra/production"
            "./infra/argocd"
          )
          while IFS= read -r path; do
            for ordered_path in "${CHART_PATHS[@]}"; do
              if [[ "$path" == "$ordered_path" ]]; then
                continue 2
              fi
            done
            CHART_PATHS+=("$path")
          done < <(find ./infra -mindepth 1 -maxdepth 1 -type d | sort)
        elif [[ "$CHART_NAME" == "sealed-secrets" ]]; then
          CHART_PATHS=("./infra/sealed-secrets")
        else
          CHART_PATHS=("./infra/sealed-secrets" "./infra/$CHART_NAME")
        fi

        for path in "${CHART_PATHS[@]}"; do
          deploy_chart "$path"

          if [[ "$path" == "./infra/sealed-secrets" ]]; then
            kubectl wait \
              --for=condition=Established \
              crd/sealedsecrets.bitnami.com \
              --timeout=120s
          fi
        done
